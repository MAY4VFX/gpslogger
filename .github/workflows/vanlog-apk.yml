name: vanlog APK

# Debug build under the original package name (com.mendhak.gpslogger), signed with a
# fixed key from secrets so updates install over each other.
on:
  push:
    branches: [vanlog]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Signing key
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore
      - name: Keep the original package name
        run: sed -i '/applicationIdSuffix ".debug"/d' gpslogger/build.gradle
      - run: ./gradlew :gpslogger:assembleDebug --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: gpslogger-vanlog
          path: gpslogger/build/outputs/apk/debug/*.apk
